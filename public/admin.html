<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL10 | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        input, textarea, select { background: #000 !important; border: 1px solid #1a1a1a !important; color: white !important; }
        input:focus, textarea:focus, select:focus { border-color: #eab308 !important; outline: none; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 1000; animation: slideIn 0.3s ease-out; max-width: 300px; }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .color-row { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .swatch-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
        .size-stock-input { width: 70px; background: #000; border: 1px solid #333; padding: 6px; border-radius: 6px; text-align: center; }
        .image-preview { position: relative; display: inline-block; margin: 4px; }
        .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .delete-preview { position: absolute; top: -8px; right: -8px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; text-align: center; line-height: 20px; }
        .sold-out-badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-left: 8px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h1 class="text-3xl font-black text-yellow-500">VAL10 ADMIN</h1>
            <div class="flex gap-3">
                <button onclick="fetchProducts()" class="bg-white text-black px-4 py-2 text-sm font-bold rounded-lg">Sync</button>
                <a href="/" class="border border-white/20 px-4 py-2 text-sm rounded-lg">Live Site</a>
            </div>
        </header>

        <div class="grid lg:grid-cols-2 gap-8 mb-12">
            <!-- Product Form -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4 text-yellow-500" id="formTitle">Add New Product</h2>
                <input type="hidden" id="productId">
                <div class="space-y-4">
                    <div><label class="text-xs uppercase">Product Name *</label><input type="text" id="name" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Price (DT) *</label><input type="number" id="price" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Description</label><textarea id="desc" rows="3" class="w-full p-2 rounded"></textarea></div>
                    
                    <!-- Dynamic Color Swatches Table -->
                    <div>
                        <label class="text-xs uppercase block mb-2">Color Swatches (name, hex, image, stock)</label>
                        <div id="colorsContainer"></div>
                        <button type="button" onclick="addColorRow()" class="mt-2 bg-zinc-800 text-white px-3 py-1 rounded text-sm">+ Add Color</button>
                        <button type="button" onclick="markAllColorsSoldOut()" class="mt-2 ml-2 bg-red-800/50 text-red-300 px-3 py-1 rounded text-sm">Mark All Colors Sold Out (stock=0)</button>
                    </div>

                    <!-- Sizes with stock inputs -->
                    <div><label class="text-xs uppercase block mb-2">Sizes & Stock</label>
                        <div class="grid grid-cols-4 gap-3">
                            <div><label>S</label><input type="number" id="stock_s" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label>M</label><input type="number" id="stock_m" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label>L</label><input type="number" id="stock_l" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label>XL</label><input type="number" id="stock_xl" class="size-stock-input w-full" value="0" min="0"></div>
                        </div>
                    </div>

                    <!-- Additional Images (fallback) -->
                    <div><label class="text-xs uppercase block mb-2">Additional Images (optional)</label>
                        <input type="file" id="galleryInput" multiple accept="image/*" class="hidden" onchange="handleImageFiles(this.files)">
                        <button type="button" onclick="document.getElementById('galleryInput').click()" class="bg-zinc-800 w-full py-2 rounded text-sm">+ Select Images</button>
                        <div id="galleryPreview" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="saveProduct()" class="bg-yellow-500 text-black font-bold py-2 px-6 rounded-lg w-full">Save Product</button>
                        <button onclick="resetForm()" class="border border-white/20 py-2 px-6 rounded-lg">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Homepage Banner Customization -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4 text-yellow-500">Homepage Hero</h2>
                <div class="space-y-4">
                    <div><label class="text-xs uppercase">Collection Title</label><input type="text" id="bannerTitle" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Hero Images (multiple)</label>
                        <input type="file" id="heroImagesInput" multiple accept="image/*" class="hidden" onchange="handleHeroImages(this.files)">
                        <button type="button" onclick="document.getElementById('heroImagesInput').click()" class="bg-zinc-800 w-full py-2 rounded text-sm">+ Add Hero Images</button>
                        <div id="heroImagesPreview" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    <button onclick="saveBanner()" class="bg-white/10 hover:bg-white hover:text-black font-bold py-2 rounded-lg w-full">Update Homepage</button>
                </div>
            </div>
        </div>

        <!-- Product Inventory List -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="text-lg font-bold mb-4">Inventory</h2>
            <div id="productList" class="space-y-3 max-h-[600px] overflow-y-auto">Loading products...</div>
        </div>
    </div>
    <div id="toastContainer"></div>

    <script>
        // ========== Helper Functions ==========
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = msg;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function compressImageToBase64(file, maxWidth = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) reject('Not an image');
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        // ========== Color Rows State ==========
        let colorRows = []; // each: { name, hex, imageBase64, stock }

        function renderColorRows() {
            const container = document.getElementById('colorsContainer');
            container.innerHTML = '';
            colorRows.forEach((row, idx) => {
                const div = document.createElement('div');
                div.className = 'color-row';
                div.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 items-end">
                        <div><label class="text-[9px]">Name</label><input type="text" data-idx="${idx}" class="color-name w-full p-1 rounded text-sm" value="${escapeHtml(row.name)}" placeholder="e.g. Black"></div>
                        <div><label class="text-[9px]">Hex</label><input type="color" data-idx="${idx}" class="color-hex w-full p-1 rounded" value="${row.hex || '#000000'}"></div>
                        <div><label class="text-[9px]">Stock</label><input type="number" data-idx="${idx}" class="color-stock w-full p-1 rounded text-sm" value="${row.stock}" min="0"></div>
                        <div><label class="text-[9px]">Image</label><button type="button" data-idx="${idx}" class="upload-color-img bg-blue-600/50 text-white px-2 py-1 rounded text-xs">Upload</button></div>
                        <div><button type="button" data-idx="${idx}" class="remove-color bg-red-600/50 text-white px-2 py-1 rounded text-xs">Remove</button></div>
                    </div>
                    <div class="mt-2">
                        ${row.imageBase64 ? `<img src="${row.imageBase64}" class="swatch-preview">` : '<span class="text-gray-500 text-[10px]">No image (required)</span>'}
                    </div>
                `;
                container.appendChild(div);
            });
            // attach events
            document.querySelectorAll('.color-name').forEach(inp => {
                inp.addEventListener('change', (e) => { colorRows[parseInt(inp.dataset.idx)].name = inp.value; });
            });
            document.querySelectorAll('.color-hex').forEach(inp => {
                inp.addEventListener('change', (e) => { colorRows[parseInt(inp.dataset.idx)].hex = inp.value; });
            });
            document.querySelectorAll('.color-stock').forEach(inp => {
                inp.addEventListener('change', (e) => { colorRows[parseInt(inp.dataset.idx)].stock = parseInt(inp.value) || 0; });
            });
            document.querySelectorAll('.upload-color-img').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const idx = parseInt(btn.dataset.idx);
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.onchange = async (event) => {
                        const file = event.target.files[0];
                        if (file) {
                            try {
                                const base64 = await compressImageToBase64(file, 800, 0.6);
                                colorRows[idx].imageBase64 = base64;
                                renderColorRows();
                            } catch (err) { showToast('Image compression failed', 'error'); }
                        }
                    };
                    fileInput.click();
                });
            });
            document.querySelectorAll('.remove-color').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.idx);
                    colorRows.splice(idx, 1);
                    renderColorRows();
                });
            });
        }

        function addColorRow() {
            colorRows.push({ name: '', hex: '#000000', imageBase64: '', stock: 0 });
            renderColorRows();
        }

        function markAllColorsSoldOut() {
            colorRows.forEach(row => row.stock = 0);
            renderColorRows();
            showToast('All color stocks set to 0', 'info');
        }

        // ========== Additional Gallery (optional) ==========
        let selectedImagesBase64 = [];
        function updateGalleryPreview() {
            const container = document.getElementById('galleryPreview');
            container.innerHTML = '';
            selectedImagesBase64.forEach((base64, idx) => {
                const div = document.createElement('div');
                div.className = 'image-preview';
                div.innerHTML = `<img src="${base64}"><div class="delete-preview" data-index="${idx}">✕</div>`;
                container.appendChild(div);
            });
            document.querySelectorAll('.delete-preview').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    selectedImagesBase64.splice(index, 1);
                    updateGalleryPreview();
                });
            });
        }
        async function handleImageFiles(files) {
            const fileArray = Array.from(files);
            if (selectedImagesBase64.length + fileArray.length > 10) { showToast('Max 10 images', 'error'); return; }
            for (let file of fileArray) {
                try {
                    const compressed = await compressImageToBase64(file, 800, 0.6);
                    selectedImagesBase64.push(compressed);
                } catch (err) { showToast(`Compression failed: ${file.name}`, 'error'); }
            }
            updateGalleryPreview();
            document.getElementById('galleryInput').value = '';
        }

        // ========== Sizes ==========
        function getSizesWithStock() {
            return [
                { size: 'S', stock: parseInt(document.getElementById('stock_s').value) || 0 },
                { size: 'M', stock: parseInt(document.getElementById('stock_m').value) || 0 },
                { size: 'L', stock: parseInt(document.getElementById('stock_l').value) || 0 },
                { size: 'XL', stock: parseInt(document.getElementById('stock_xl').value) || 0 }
            ];
        }

        // ========== Save Product ==========
        async function saveProduct() {
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            if (!name || isNaN(price)) { showToast('Name and valid price required', 'error'); return; }

            // Validate color rows: each must have name and image
            const validColors = colorRows.filter(c => c.name.trim() !== '' && c.imageBase64);
            if (colorRows.length > 0 && validColors.length !== colorRows.length) {
                showToast('Each color must have a name and an image', 'error');
                return;
            }
            // Map to the structure expected by the schema
            const colorsForDB = validColors.map(c => ({
                name: c.name,
                hex: c.hex || '#000000',
                image: c.imageBase64,
                stock: c.stock
            }));

            const payload = {
                name, price,
                description: document.getElementById('desc').value,
                colors: colorsForDB,
                sizes: getSizesWithStock(),
                images: selectedImagesBase64
            };
            const productId = document.getElementById('productId').value;
            const url = productId ? `/api/products/${productId}` : '/api/products';
            const method = productId ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
                showToast(productId ? 'Product updated' : 'Product created', 'success');
                resetForm();
                fetchProducts();
            } catch (err) { showToast(`Error: ${err.message}`, 'error'); }
        }

        // ========== Edit Product ==========
        function editProduct(product) {
            document.getElementById('formTitle').innerText = 'Edit Product';
            document.getElementById('productId').value = product._id;
            document.getElementById('name').value = product.name;
            document.getElementById('price').value = product.price;
            document.getElementById('desc').value = product.description || '';
            colorRows = (product.colors || []).map(c => ({ name: c.name, hex: c.hex || '#000000', imageBase64: c.image, stock: c.stock }));
            renderColorRows();
            const sizeMap = { S: 's', M: 'm', L: 'l', XL: 'xl' };
            product.sizes.forEach(s => { document.getElementById(`stock_${sizeMap[s.size]}`).value = s.stock; });
            selectedImagesBase64 = [...(product.images || [])];
            updateGalleryPreview();
        }

        async function deleteProduct(id) {
            if (!confirm('Delete product?')) return;
            try {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                showToast('Product deleted', 'success');
                fetchProducts();
                if (document.getElementById('productId').value === id) resetForm();
            } catch (err) { showToast('Delete failed', 'error'); }
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Add New Product';
            document.getElementById('productId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('desc').value = '';
            colorRows = [];
            renderColorRows();
            document.getElementById('stock_s').value = 0;
            document.getElementById('stock_m').value = 0;
            document.getElementById('stock_l').value = 0;
            document.getElementById('stock_xl').value = 0;
            selectedImagesBase64 = [];
            updateGalleryPreview();
        }

        // ========== Load Product List ==========
        async function fetchProducts() {
            const container = document.getElementById('productList');
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                if (!products.length) { container.innerHTML = '<div class="text-center py-10">No products</div>'; return; }
                container.innerHTML = '';
                products.forEach(p => {
                    const colorNames = (p.colors || []).map(c => c.name).join(', ');
                    const isSoldOut = p.isSoldOut;
                    const card = document.createElement('div');
                    card.className = `bg-white/5 p-4 rounded-xl border ${isSoldOut ? 'border-red-500/50' : 'border-white/10'}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold">${escapeHtml(p.name)} ${isSoldOut ? '<span class="sold-out-badge">SOLD OUT</span>' : ''}</h3>
                                <p class="text-yellow-500">${p.price} DT</p>
                                <p class="text-[10px] text-gray-400">Colors: ${colorNames || 'none'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick='editProduct(${JSON.stringify(p)})' class="bg-blue-600/30 text-blue-300 px-3 py-1 rounded text-xs">Edit</button>
                                <button onclick='deleteProduct("${p._id}")' class="bg-red-600/30 text-red-300 px-3 py-1 rounded text-xs">Delete</button>
                            </div>
                        </div>`;
                    container.appendChild(card);
                });
            } catch (err) { container.innerHTML = '<div class="text-red-500">Error loading products</div>'; }
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        // ========== Hero Banner ==========
        let heroImagesBase64 = [];
        function updateHeroPreview() {
            const container = document.getElementById('heroImagesPreview');
            container.innerHTML = '';
            heroImagesBase64.forEach((base64, idx) => {
                const div = document.createElement('div');
                div.className = 'image-preview';
                div.innerHTML = `<img src="${base64}"><div class="delete-preview" data-hero-index="${idx}">✕</div>`;
                container.appendChild(div);
            });
            document.querySelectorAll('[data-hero-index]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-hero-index'));
                    heroImagesBase64.splice(index, 1);
                    updateHeroPreview();
                });
            });
        }
        async function handleHeroImages(files) {
            for (let file of Array.from(files)) {
                try {
                    const compressed = await compressImageToBase64(file, 1920, 0.7);
                    heroImagesBase64.push(compressed);
                } catch (err) { showToast('Hero image compression failed', 'error'); }
            }
            updateHeroPreview();
            document.getElementById('heroImagesInput').value = '';
        }
        async function loadBanner() {
            try {
                const res = await fetch('/api/homepage-hero');
                const data = await res.json();
                document.getElementById('bannerTitle').value = data.title || '';
                heroImagesBase64 = data.heroImages || [];
                updateHeroPreview();
            } catch (err) { console.error(err); }
        }
        async function saveBanner() {
            const payload = { title: document.getElementById('bannerTitle').value, heroImages: heroImagesBase64 };
            try {
                await fetch('/api/homepage-hero', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                showToast('Homepage updated', 'success');
            } catch (err) { showToast('Update failed', 'error'); }
        }

        window.onload = () => { fetchProducts(); loadBanner(); };
    </script>
</body>
</html>
