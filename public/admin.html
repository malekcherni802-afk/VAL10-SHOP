<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL10 | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        input, textarea, select { background: #000 !important; border: 1px solid #1a1a1a !important; color: white !important; }
        input:focus, textarea:focus, select:focus { border-color: #eab308 !important; outline: none; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 1000; animation: slideIn 0.3s ease-out; max-width: 300px; }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .image-preview { position: relative; display: inline-block; margin: 4px; }
        .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .delete-preview { position: absolute; top: -8px; right: -8px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; text-align: center; line-height: 20px; }
        .size-stock-input { width: 70px; background: #000; border: 1px solid #333; padding: 6px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h1 class="text-3xl font-black text-yellow-500">VAL10 ADMIN</h1>
            <div class="flex gap-3">
                <button onclick="fetchProducts()" class="bg-white text-black px-4 py-2 text-sm font-bold rounded-lg">Sync</button>
                <a href="/" class="border border-white/20 px-4 py-2 text-sm rounded-lg">Live Site</a>
            </div>
        </header>

        <!-- Product Form + Homepage Customization -->
        <div class="grid lg:grid-cols-2 gap-8 mb-12">
            <!-- Product Form -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4 text-yellow-500" id="formTitle">Add New Product</h2>
                <input type="hidden" id="productId">
                <div class="space-y-4">
                    <div><label class="text-xs uppercase">Product Name *</label><input type="text" id="name" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Price (DT) *</label><input type="number" id="price" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Description</label><textarea id="desc" rows="3" class="w-full p-2 rounded"></textarea></div>
                    <div><label class="text-xs uppercase">Colors (comma separated)</label><input type="text" id="colors" class="w-full p-2 rounded" placeholder="Black, White, Red"></div>
                    
                    <!-- Sizes with stock inputs -->
                    <div><label class="text-xs uppercase block mb-2">Sizes & Stock</label>
                        <div class="grid grid-cols-4 gap-3">
                            <div><label class="text-[10px]">S</label><input type="number" id="stock_s" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label class="text-[10px]">M</label><input type="number" id="stock_m" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label class="text-[10px]">L</label><input type="number" id="stock_l" class="size-stock-input w-full" value="0" min="0"></div>
                            <div><label class="text-[10px]">XL</label><input type="number" id="stock_xl" class="size-stock-input w-full" value="0" min="0"></div>
                        </div>
                        <button type="button" onclick="markCurrentAsSoldOut()" class="mt-2 text-[10px] bg-red-600/30 text-red-300 px-3 py-1 rounded hover:bg-red-600 hover:text-white transition">Mark as Sold Out (set all stocks to 0)</button>
                    </div>

                    <!-- Multi image gallery -->
                    <div><label class="text-xs uppercase block mb-2">Product Images (max 10)</label>
                        <input type="file" id="galleryInput" multiple accept="image/*" class="hidden" onchange="handleImageFiles(this.files)">
                        <button type="button" onclick="document.getElementById('galleryInput').click()" class="bg-zinc-800 w-full py-2 rounded text-sm">+ Select Images</button>
                        <div id="galleryPreview" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="saveProduct()" class="bg-yellow-500 text-black font-bold py-2 px-6 rounded-lg w-full">Save Product</button>
                        <button onclick="resetForm()" class="border border-white/20 py-2 px-6 rounded-lg">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Homepage Banner Customization -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4 text-yellow-500">Homepage Hero</h2>
                <div class="space-y-4">
                    <div><label class="text-xs uppercase">Collection Title</label><input type="text" id="bannerTitle" class="w-full p-2 rounded"></div>
                    <div><label class="text-xs uppercase">Hero Images (multiple, for slider)</label>
                        <input type="file" id="heroImagesInput" multiple accept="image/*" class="hidden" onchange="handleHeroImages(this.files)">
                        <button type="button" onclick="document.getElementById('heroImagesInput').click()" class="bg-zinc-800 w-full py-2 rounded text-sm">+ Add Hero Images</button>
                        <div id="heroImagesPreview" class="flex flex-wrap gap-2 mt-3"></div>
                        <input type="hidden" id="heroImagesBase64">
                    </div>
                    <button onclick="saveBanner()" class="bg-white/10 hover:bg-white hover:text-black font-bold py-2 rounded-lg w-full">Update Homepage</button>
                </div>
            </div>
        </div>

        <!-- Product Inventory List -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="text-lg font-bold mb-4">Inventory</h2>
            <div id="productList" class="space-y-3 max-h-[600px] overflow-y-auto">
                <div class="text-center py-10">Loading products...</div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ---------- Toast ----------
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ---------- Image Compression (to Base64) ----------
        function compressImageToBase64(file, maxWidth = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    reject(new Error('Not an image file'));
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64 = canvas.toDataURL('image/jpeg', quality);
                        resolve(base64);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        // ---------- Product Gallery State ----------
        let selectedImagesBase64 = [];

        function updateGalleryPreview() {
            const container = document.getElementById('galleryPreview');
            container.innerHTML = '';
            selectedImagesBase64.forEach((base64, idx) => {
                const div = document.createElement('div');
                div.className = 'image-preview';
                div.innerHTML = `
                    <img src="${base64}">
                    <div class="delete-preview" data-index="${idx}">✕</div>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('.delete-preview').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    selectedImagesBase64.splice(index, 1);
                    updateGalleryPreview();
                });
            });
        }

        async function handleImageFiles(files) {
            const fileArray = Array.from(files);
            if (selectedImagesBase64.length + fileArray.length > 10) {
                showToast('Maximum 10 images allowed', 'error');
                return;
            }
            for (let file of fileArray) {
                try {
                    const compressed = await compressImageToBase64(file, 800, 0.6);
                    selectedImagesBase64.push(compressed);
                } catch (err) {
                    showToast(`Failed to compress ${file.name}: ${err.message}`, 'error');
                }
            }
            updateGalleryPreview();
            document.getElementById('galleryInput').value = '';
        }

        // ---------- Build sizes array from stock inputs ----------
        function getSizesWithStock() {
            const sizesMap = [
                { size: 'S', stock: parseInt(document.getElementById('stock_s').value) || 0 },
                { size: 'M', stock: parseInt(document.getElementById('stock_m').value) || 0 },
                { size: 'L', stock: parseInt(document.getElementById('stock_l').value) || 0 },
                { size: 'XL', stock: parseInt(document.getElementById('stock_xl').value) || 0 }
            ];
            return sizesMap;
        }

        // ---------- Mark current edited product as sold out ----------
        function markCurrentAsSoldOut() {
            document.getElementById('stock_s').value = 0;
            document.getElementById('stock_m').value = 0;
            document.getElementById('stock_l').value = 0;
            document.getElementById('stock_xl').value = 0;
            showToast('All stocks set to 0. Save the product to mark as Sold Out.', 'info');
        }

        // ---------- Save / Update Product ----------
        async function saveProduct() {
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            if (!name || isNaN(price)) {
                showToast('Product name and valid price are required', 'error');
                return;
            }
            const colorsRaw = document.getElementById('colors').value;
            const colors = colorsRaw ? colorsRaw.split(',').map(c => c.trim()).filter(c => c) : [];
            const sizes = getSizesWithStock();
            const description = document.getElementById('desc').value;
            const images = selectedImagesBase64;

            const payload = { name, price, description, colors, sizes, images };
            const productId = document.getElementById('productId').value;
            const url = productId ? `/api/products/${productId}` : '/api/products';
            const method = productId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error || `Server responded with ${res.status}`);
                }
                showToast(productId ? 'Product updated' : 'Product created', 'success');
                resetForm();
                fetchProducts();
            } catch (err) {
                showToast(`Error: ${err.message}`, 'error');
            }
        }

        // ---------- Edit product (populate form) ----------
        function editProduct(product) {
            document.getElementById('formTitle').innerText = 'Edit Product';
            document.getElementById('productId').value = product._id;
            document.getElementById('name').value = product.name;
            document.getElementById('price').value = product.price;
            document.getElementById('desc').value = product.description || '';
            document.getElementById('colors').value = (product.colors || []).join(', ');
            // stock inputs
            const sizeMap = { S: 's', M: 'm', L: 'l', XL: 'xl' };
            product.sizes.forEach(s => {
                const field = sizeMap[s.size];
                if (field) document.getElementById(`stock_${field}`).value = s.stock;
            });
            // images
            selectedImagesBase64 = [...(product.images || [])];
            updateGalleryPreview();
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            try {
                const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                showToast('Product deleted', 'success');
                fetchProducts();
                if (document.getElementById('productId').value === id) resetForm();
            } catch (err) {
                showToast(`Delete failed: ${err.message}`, 'error');
            }
        }

        // ---------- Mark any product as sold out via API (set all stocks to 0) ----------
        async function markProductSoldOut(productId) {
            if (!confirm('Set all sizes stock to 0? This will mark the product as Sold Out.')) return;
            try {
                // Fetch current product
                const res = await fetch(`/api/products/${productId}`);
                if (!res.ok) throw new Error('Product not found');
                const product = await res.json();
                // Set all stocks to 0
                const newSizes = product.sizes.map(s => ({ ...s, stock: 0 }));
                const updateRes = await fetch(`/api/products/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...product, sizes: newSizes })
                });
                if (!updateRes.ok) throw new Error('Update failed');
                showToast('Product marked as Sold Out', 'success');
                fetchProducts();
                // If this product is currently being edited, refresh the form
                if (document.getElementById('productId').value === productId) {
                    editProduct({ ...product, sizes: newSizes });
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, 'error');
            }
        }

        function resetForm() {
            document.getElementById('formTitle').innerText = 'Add New Product';
            document.getElementById('productId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('colors').value = '';
            document.getElementById('stock_s').value = 0;
            document.getElementById('stock_m').value = 0;
            document.getElementById('stock_l').value = 0;
            document.getElementById('stock_xl').value = 0;
            selectedImagesBase64 = [];
            updateGalleryPreview();
        }

        // ---------- Load Product List ----------
        async function fetchProducts() {
            const container = document.getElementById('productList');
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('Failed to fetch');
                const products = await res.json();
                if (!products.length) {
                    container.innerHTML = '<div class="text-center py-10 text-gray-400">No products yet</div>';
                    return;
                }
                container.innerHTML = '';
                products.forEach(p => {
                    const isSoldOut = p.isSoldOut;
                    const sizesStock = p.sizes.map(s => `${s.size}:${s.stock}`).join(', ');
                    const card = document.createElement('div');
                    card.className = `bg-white/5 p-4 rounded-xl border ${isSoldOut ? 'border-red-500/30' : 'border-white/10'}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold">${escapeHtml(p.name)}</h3>
                                <p class="text-yellow-500 text-sm">${p.price} DT</p>
                                <p class="text-[10px] text-gray-400 mt-1">Sizes: ${sizesStock}</p>
                                ${isSoldOut ? '<span class="text-red-400 text-[10px] font-bold">SOLD OUT</span>' : ''}
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                <button onclick='editProduct(${JSON.stringify(p)})' class="bg-blue-600/30 text-blue-300 px-3 py-1 rounded text-xs">Edit</button>
                                <button onclick='markProductSoldOut("${p._id}")' class="bg-red-600/30 text-red-300 px-3 py-1 rounded text-xs">Sold Out</button>
                                <button onclick='deleteProduct("${p._id}")' class="bg-gray-600/30 text-gray-300 px-3 py-1 rounded text-xs">Delete</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-center text-red-500">Error: ${err.message}</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ---------- Hero Images Handling (multi‑image slider) ----------
        let heroImagesBase64 = [];

        function updateHeroPreview() {
            const container = document.getElementById('heroImagesPreview');
            container.innerHTML = '';
            heroImagesBase64.forEach((base64, idx) => {
                const div = document.createElement('div');
                div.className = 'image-preview';
                div.innerHTML = `
                    <img src="${base64}">
                    <div class="delete-preview" data-hero-index="${idx}">✕</div>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('[data-hero-index]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(btn.getAttribute('data-hero-index'));
                    heroImagesBase64.splice(index, 1);
                    updateHeroPreview();
                });
            });
        }

        async function handleHeroImages(files) {
            const fileArray = Array.from(files);
            for (let file of fileArray) {
                try {
                    const compressed = await compressImageToBase64(file, 1920, 0.7);
                    heroImagesBase64.push(compressed);
                } catch (err) {
                    showToast(`Hero image compression failed: ${err.message}`, 'error');
                }
            }
            updateHeroPreview();
            document.getElementById('heroImagesInput').value = '';
        }

        async function loadBanner() {
            try {
                const res = await fetch('/api/homepage-hero');
                const data = await res.json();
                document.getElementById('bannerTitle').value = data.title || '';
                heroImagesBase64 = data.heroImages || [];
                updateHeroPreview();
            } catch (err) { console.error(err); }
        }

        async function saveBanner() {
            const title = document.getElementById('bannerTitle').value;
            const payload = { title, heroImages: heroImagesBase64 };
            try {
                const res = await fetch('/api/homepage-hero', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(await res.text());
                showToast('Homepage banner updated', 'success');
            } catch (err) {
                showToast(`Banner error: ${err.message}`, 'error');
            }
        }

        // ---------- Initialization ----------
        window.onload = () => {
            fetchProducts();
            loadBanner();
        };
    </script>
</body>
</html>
