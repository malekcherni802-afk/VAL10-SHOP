<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL10 | Underground Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Syne', sans-serif;
            overflow-x: hidden;
        }
        .gothic-text { font-family: 'Pirata One', cursive; letter-spacing: 0.1em; }
        .fade-in { animation: fadeIn 1.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .product-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-10px); }
        .product-card img   { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover img { transform: scale(1.1); }

        ::-webkit-scrollbar       { width: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* ── Color Swatch ─────────────────────────────────────── */
        .swatch-strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .color-swatch {
            position: relative; width: 22px; height: 22px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .color-swatch:not(.sold-out):hover {
            transform: scale(1.25); border-color: rgba(255,255,255,0.7);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
        }
        .color-swatch.active {
            border-color: #eab308; box-shadow: 0 0 0 2px rgba(234,179,8,0.4); transform: scale(1.2);
        }
        .color-swatch.sold-out {
            filter: grayscale(1) brightness(0.45); opacity: 0.5; pointer-events: all;
        }
        .color-swatch.sold-out::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, transparent 42%, rgba(255,60,60,0.85) 42%, rgba(255,60,60,0.85) 58%, transparent 58%);
        }
        .color-swatch[data-label]::before {
            content: attr(data-label); position: absolute; bottom: calc(100% + 6px);
            left: 50%; transform: translateX(-50%); background: #111; color: #fff;
            font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
            padding: 3px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.15s ease; border: 1px solid rgba(255,255,255,0.08);
        }
        .color-swatch:hover::before { opacity: 1; }
        .color-swatch.sold-out:hover { transform: none; cursor: not-allowed; }

        /* ── Size Pills on card ───────────────────────────────── */
        .size-pill {
            display: inline-flex; align-items: center;
            font-size: 8px; font-family: 'Courier New', monospace;
            font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 2px 7px; border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.12); color: #a3a3a3;
            background: transparent; transition: border-color 0.15s;
        }
        .size-pill.in-stock  { border-color: rgba(234,179,8,0.35); color: #ca8a04; }
        .size-pill.no-stock  { opacity: 0.32; text-decoration: line-through; }

        /* ── Toast ────────────────────────────────────────────── */
        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
            border-radius: 8px; font-size: 12px; font-weight: 700; z-index: 9999;
            animation: slideIn 0.3s ease-out; max-width: 300px;
        }
        @keyframes slideIn {
            from { transform: translateX(110%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        .toast-success { background: #10b981; color: white; }
        .toast-error   { background: #ef4444; color: white; }
        .toast-info    { background: #3b82f6; color: white; }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">

    <!-- Nav -->
    <nav class="fixed w-full z-[100] bg-black/80 backdrop-blur-lg border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <h1 class="text-4xl sm:text-5xl gothic-text tracking-[0.2em] cursor-pointer hover:text-gray-400 transition-colors"
                onclick="window.location.href='/'">VAL10</h1>
            <div class="flex items-center gap-8">
                <button class="hidden md:block text-[10px] tracking-[0.3em] uppercase text-gray-500 hover:text-white transition">Archive</button>
                <button class="text-[10px] sm:text-xs font-bold tracking-[0.2em] border border-white/20 px-6 py-2.5 hover:bg-white hover:text-black transition-all duration-500 uppercase"
                        onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
                    COLLECTION 2026
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Slideshow -->
    <header id="hero-banner" class="relative h-screen overflow-hidden">
        <div id="hero-slides" class="absolute inset-0"></div>
        <div class="absolute inset-0 bg-black/55 z-10 pointer-events-none"></div>
        <div id="hero-dots" class="absolute bottom-24 left-1/2 -translate-x-1/2 z-30 flex gap-2"></div>

        <button id="hero-prev" onclick="slideshowStep(-1)"
                class="absolute left-6 top-1/2 -translate-y-1/2 z-30 w-10 h-10 rounded-full bg-black/40 border border-white/10 text-white flex items-center justify-center hover:bg-white hover:text-black transition-all opacity-0 hover:opacity-100 focus:opacity-100"
                aria-label="Previous slide">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <button id="hero-next" onclick="slideshowStep(1)"
                class="absolute right-6 top-1/2 -translate-y-1/2 z-30 w-10 h-10 rounded-full bg-black/40 border border-white/10 text-white flex items-center justify-center hover:bg-white hover:text-black transition-all opacity-0 hover:opacity-100 focus:opacity-100"
                aria-label="Next slide">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>

        <div class="relative z-20 h-full flex flex-col justify-center items-center text-center fade-in px-4 pointer-events-none">
            <span class="text-[10px] tracking-[0.8em] uppercase text-gray-400 mb-4 block">Est. MMXXIV</span>
            <h2 class="text-6xl sm:text-8xl md:text-9xl font-extrabold uppercase tracking-tighter leading-none mb-8">
                Define <br>
                <span class="italic text-transparent bg-clip-text bg-gradient-to-b from-white to-zinc-800">Your Ego</span>
            </h2>
            <a href="#shop"
               class="pointer-events-auto inline-block bg-white text-black px-12 py-4 font-black text-sm hover:bg-gray-200 transition-all tracking-[0.2em] uppercase shadow-2xl">
                Explore Drop
            </a>
            <p id="hero-caption" class="pointer-events-none mt-6 text-[10px] tracking-[0.3em] text-gray-400 uppercase opacity-0 transition-opacity duration-500"></p>
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-30 animate-bounce pointer-events-none">
            <div class="w-[1px] h-12 bg-gradient-to-b from-white to-transparent"></div>
        </div>
    </header>

    <!-- Shop Grid -->
    <main id="shop" class="max-w-7xl mx-auto px-6 py-32">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-20 gap-4">
            <div>
                <h3 class="text-4xl sm:text-6xl gothic-text text-white uppercase mb-2">The Archive</h3>
                <p class="text-[10px] tracking-[0.3em] text-gray-500 uppercase">Season 01 / Selected Pieces</p>
            </div>
            <div class="h-[1px] flex-1 bg-white/10 mx-10 hidden md:block mb-4"></div>
            <span class="text-[10px] text-gray-400 tracking-widest uppercase italic">Drop 1.0</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12" id="product-grid">
            <div class="col-span-full flex flex-col items-center py-20">
                <div class="w-10 h-10 border-2 border-white/20 border-t-white rounded-full animate-spin mb-4"></div>
                <p class="text-[10px] tracking-[0.4em] text-gray-500 uppercase">Loading Archive...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-20 bg-black">
        <div class="max-w-7xl mx-auto px-6 flex flex-col items-center">
            <h4 class="gothic-text text-4xl mb-8 tracking-widest">VAL10</h4>
            <div class="flex gap-8 mb-12 text-[10px] tracking-[0.3em] uppercase text-gray-500">
                <a href="#" class="hover:text-white transition">Instagram</a>
                <a href="#" class="hover:text-white transition">Privacy</a>
                <a href="#" class="hover:text-white transition">Terms</a>
            </div>
            <p class="text-[9px] text-gray-700 tracking-[0.5em] uppercase">© 2026 VAL10 STUDIO. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

<!-- ═══════════════════════════════ SCRIPTS -->
<script>
'use strict';

/* ── Toast ──────────────────────────────────────────────────────── */
function showToast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

/* ══════════════════════════════════════════════════════════════════
   normaliseSizes(rawSizes)

   The DB can hold TWO formats:
     NEW → sizes = [{ size: "M", stock: 5 }, { size: "L", stock: 0 }]
     OLD → sizes = ["S", "M", "L"]   (plain strings, no per-size stock)

   This function ALWAYS returns [{ size: String, stock: Number }]
   so everything downstream is format-agnostic.
   ══════════════════════════════════════════════════════════════════ */
function normaliseSizes(rawSizes) {
    if (!rawSizes || !Array.isArray(rawSizes) || rawSizes.length === 0) return [];

    return rawSizes
        .map(s => {
            if (s && typeof s === 'object' && s.size !== undefined) {
                // New format: { size, stock }
                return { size: String(s.size), stock: Number(s.stock) || 0 };
            }
            if (typeof s === 'string' && s.trim()) {
                // Old format: plain string — no stock data, treat as available
                return { size: s.trim(), stock: 1 };
            }
            return null;
        })
        .filter(s => s && s.size && s.size !== 'undefined' && s.size !== 'null');
}

/* ── Color Swatch Strip ─────────────────────────────────────────── */
function buildSwatchStrip(colors, onSelect) {
    const strip = document.createElement('div');
    strip.className = 'swatch-strip';

    colors.forEach((color, idx) => {
        const isSoldOut = color.stock === 0 || color.availability === 'Sold Out';

        const swatch = document.createElement('span');
        swatch.className        = 'color-swatch' + (isSoldOut ? ' sold-out' : '');
        swatch.style.background = color.hex || '#888';
        swatch.dataset.label    = color.name + (isSoldOut ? ' — Sold Out' : '');
        swatch.title            = color.name + (isSoldOut ? ' (Sold Out)' : '');

        if (!isSoldOut) {
            swatch.addEventListener('click', e => {
                e.stopPropagation();
                strip.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                onSelect(idx, color);
            });
        }

        strip.appendChild(swatch);
    });

    return strip;
}

/* ── Size Pills (card preview) ──────────────────────────────────── */
function buildSizePills(product) {
    const sizes = normaliseSizes(product.sizes);
    if (!sizes.length) return null;

    const wrap = document.createElement('div');
    wrap.className = 'flex flex-wrap gap-1 mt-2 mb-1';

    sizes.forEach(s => {
        const inStock = s.stock > 0;
        const pill = document.createElement('span');
        pill.className   = `size-pill ${inStock ? 'in-stock' : 'no-stock'}`;
        pill.textContent = s.size;
        pill.title       = inStock ? `${s.size} — ${s.stock} left` : `${s.size} — Sold Out`;
        wrap.appendChild(pill);
    });

    return wrap;
}

/* ── Product Card ───────────────────────────────────────────────── */
function buildProductCard(product) {
    const colors = Array.isArray(product.colors) ? product.colors : [];

    // Best initial image: first in-stock color → first color → legacy → placeholder
    const firstAvailable = colors.find(c => c.stock > 0) || colors[0];
    const initialImg = firstAvailable?.image
        || (product.images?.length ? product.images[0] : null)
        || 'https://via.placeholder.com/600x800/111/333?text=VAL10';

    // Sold-out logic — must check BOTH colors and sizes
    const sizes = normaliseSizes(product.sizes);
    const allColorsSoldOut = colors.length > 0 && colors.every(c => (c.stock || 0) === 0);
    const allSizesSoldOut  = sizes.length  > 0 && sizes.every(s => s.stock === 0);

    // Product is fully sold out only when every variant is gone
    const allSoldOut =
        (colors.length === 0 && sizes.length === 0)  ? false   // no variants = assume available
        : (colors.length > 0 && sizes.length > 0)    ? allColorsSoldOut && allSizesSoldOut
        : (colors.length > 0)                         ? allColorsSoldOut
        :                                               allSizesSoldOut;

    /* Card shell */
    const card = document.createElement('div');
    card.className = 'group cursor-pointer fade-in product-card';

    /* Image container */
    const imgWrap = document.createElement('div');
    imgWrap.className = 'relative overflow-hidden aspect-[3/4] bg-zinc-900 mb-5 border border-white/5';

    const img = document.createElement('img');
    img.src       = initialImg;
    img.alt       = product.name;
    img.loading   = 'lazy';
    img.className = 'w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-500';

    /* Hover overlay */
    const hoverOverlay = document.createElement('div');
    hoverOverlay.className = 'absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center pointer-events-none';
    hoverOverlay.innerHTML = `
        <div class="translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
            <span class="bg-white text-black px-8 py-3 font-bold text-[10px] tracking-[0.3em] uppercase">View Piece</span>
        </div>`;

    /* Sold-out overlay */
    if (allSoldOut) {
        const soldOutOverlay = document.createElement('div');
        soldOutOverlay.className = 'absolute inset-0 bg-black/60 flex items-center justify-center z-10';
        soldOutOverlay.innerHTML = `<span class="text-[10px] font-black uppercase tracking-[0.4em] text-red-400 border border-red-400/30 px-4 py-2">Sold Out</span>`;
        imgWrap.appendChild(soldOutOverlay);
    }

    imgWrap.appendChild(img);
    imgWrap.appendChild(hoverOverlay);

    /* Navigate on click */
    card.addEventListener('click', () => {
        window.location.href = `/product?id=${product._id}`;
    });

    /* Info section */
    const info = document.createElement('div');
    info.className = 'px-1';

    const topRow = document.createElement('div');
    topRow.className = 'flex justify-between items-start mb-2';
    topRow.innerHTML = `
        <h3 class="text-base font-bold uppercase tracking-tighter text-gray-100 truncate pr-2">${product.name}</h3>
        <span class="font-mono text-gray-400 flex-shrink-0">${product.price} DT</span>`;

    const subLine = document.createElement('p');
    subLine.className = 'text-[9px] tracking-[0.2em] text-gray-600 uppercase mb-2';
    subLine.textContent = product.category || 'Limited Edition Drop';

    /* Size pills — correctly handles both DB formats */
    const sizePills = buildSizePills(product);

    /* Color swatches */
    let swatchSection = null;
    if (colors.length > 0) {
        swatchSection = document.createElement('div');
        swatchSection.className = 'flex items-center gap-3 mt-2';

        const colorLabel = document.createElement('span');
        colorLabel.className = 'text-[8px] text-gray-500 uppercase tracking-widest transition-all';
        colorLabel.textContent = firstAvailable?.name || '';

        const strip = buildSwatchStrip(colors, (idx, color) => {
            if (color.image) img.src = color.image;
            colorLabel.textContent = color.name;
        });

        const firstInStockSwatch = strip.querySelector('.color-swatch:not(.sold-out)');
        if (firstInStockSwatch) firstInStockSwatch.classList.add('active');

        swatchSection.appendChild(strip);
        swatchSection.appendChild(colorLabel);
    }

    info.appendChild(topRow);
    info.appendChild(subLine);
    if (sizePills)     info.appendChild(sizePills);
    if (swatchSection) info.appendChild(swatchSection);

    card.appendChild(imgWrap);
    card.appendChild(info);

    return card;
}

/* ── Fetch & Render Products ────────────────────────────────────── */
async function fetchProducts() {
    const grid = document.getElementById('product-grid');
    try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data     = await res.json();
        // FIX: server now returns { products: [...], total, page, limit }
        const products = Array.isArray(data) ? data : (data.products || []);
        grid.innerHTML = '';

        if (!products.length) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-20">
                    <p class="text-[10px] uppercase tracking-[0.5em] text-gray-600">Archive Empty</p>
                </div>`;
            return;
        }

        products.forEach(product => grid.appendChild(buildProductCard(product)));

    } catch (err) {
        console.error('fetchProducts error:', err);
        grid.innerHTML = `
            <div class="col-span-full text-center py-20">
                <p class="text-red-900 text-[10px] uppercase tracking-widest mb-2">Archive Connection Error</p>
                <p class="text-gray-600 text-[9px] mb-4">${err.message}</p>
                <button onclick="fetchProducts()"
                        class="text-[10px] text-gray-500 hover:text-white uppercase tracking-widest border border-white/10 px-4 py-2 rounded transition">
                    Retry
                </button>
            </div>`;
        showToast('Failed to load products', 'error');
    }
}

/* ── Slideshow ──────────────────────────────────────────────────── */
const FALLBACK_SLIDE = {
    imageUrl: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop',
    linkUrl:  '#shop',
    caption:  ''
};
let _ssSlides  = [];
let _ssCurrent = 0;
let _ssTimer   = null;
const SS_INTERVAL = 5000;

function buildSlideEl(slide) {
    const div = document.createElement('div');
    div.className = 'absolute inset-0 transition-opacity duration-700 ease-in-out opacity-0';
    div.style.backgroundImage    = `url('${slide.imageUrl}')`;
    div.style.backgroundSize     = 'cover';
    div.style.backgroundPosition = 'center';
    const a = document.createElement('a');
    a.href      = slide.linkUrl || '#shop';
    a.className = 'absolute inset-0 block';
    a.setAttribute('aria-label', slide.caption || 'Homepage banner');
    div.appendChild(a);
    return div;
}

function initSlideshow(slides) {
    _ssSlides  = slides.length ? slides : [FALLBACK_SLIDE];
    _ssCurrent = 0;
    const container = document.getElementById('hero-slides');
    const dotsWrap  = document.getElementById('hero-dots');
    container.innerHTML = '';
    dotsWrap.innerHTML  = '';

    _ssSlides.forEach((slide, i) => {
        const el = buildSlideEl(slide);
        el.dataset.slideIndex = i;
        container.appendChild(el);
    });

    if (_ssSlides.length > 1) {
        _ssSlides.forEach((_, i) => {
            const dot = document.createElement('button');
            dot.className = 'w-1.5 h-1.5 rounded-full border border-white/40 transition-all duration-300 bg-transparent';
            dot.setAttribute('aria-label', `Slide ${i + 1}`);
            dot.onclick = () => { goToSlide(i); restartAutoAdvance(); };
            dotsWrap.appendChild(dot);
        });
        ['hero-prev','hero-next'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.style.opacity = '0.7'; el.classList.remove('opacity-0'); }
        });
    }
    goToSlide(0);
    startAutoAdvance();
}

function goToSlide(index) {
    const slideEls = document.querySelectorAll('#hero-slides > div');
    const dots     = document.querySelectorAll('#hero-dots button');
    _ssCurrent = ((index % _ssSlides.length) + _ssSlides.length) % _ssSlides.length;
    slideEls.forEach((el, i) => {
        el.style.opacity = i === _ssCurrent ? '1' : '0';
        el.style.zIndex  = i === _ssCurrent ? '1' : '0';
    });
    dots.forEach((dot, i) => {
        const active = i === _ssCurrent;
        dot.className = `rounded-full border border-white/40 transition-all duration-300 ${active ? 'bg-white w-4 h-1.5' : 'bg-transparent w-1.5 h-1.5'}`;
    });
    const caption   = _ssSlides[_ssCurrent]?.caption || '';
    const captionEl = document.getElementById('hero-caption');
    if (captionEl) {
        captionEl.textContent  = caption;
        captionEl.style.opacity = caption ? '1' : '0';
    }
}

function slideshowStep(dir)   { goToSlide(_ssCurrent + dir); restartAutoAdvance(); }
function startAutoAdvance()   { if (_ssSlides.length > 1) _ssTimer = setInterval(() => goToSlide(_ssCurrent + 1), SS_INTERVAL); }
function restartAutoAdvance() { clearInterval(_ssTimer); startAutoAdvance(); }

const heroEl = document.getElementById('hero-banner');
if (heroEl) {
    heroEl.addEventListener('mouseenter', () => clearInterval(_ssTimer));
    heroEl.addEventListener('mouseleave', startAutoAdvance);
}
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  slideshowStep(-1);
    if (e.key === 'ArrowRight') slideshowStep(1);
});

async function fetchBanner() {
    try {
        const res = await fetch('/api/banner');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const banner = await res.json();
        const slides = Array.isArray(banner?.slides) && banner.slides.length
            ? banner.slides : [FALLBACK_SLIDE];
        initSlideshow(slides);
    } catch (err) {
        console.warn('Banner fetch failed, using fallback:', err.message);
        initSlideshow([FALLBACK_SLIDE]);
    }
}

/* ── Init ───────────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    fetchBanner();
    fetchProducts();
});
</script>
</body>
</html>
